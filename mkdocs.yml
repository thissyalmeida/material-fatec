site_name: Fatec Academic Framework
site_description: Portal Acadêmico da Profª Me. Thissiany Almeida
site_author: Profª Me. Thissiany Almeida

theme:
  name: material
  language: pt-BR

  palette:

    - scheme: default
      primary: red
      accent: red
      toggle:
        icon: material/weather-night
        name: Tema escuro

    - scheme: slate
      primary: red
      accent: red
      toggle:
        icon: material/weather-sunny
        name: Tema claro

  features:

    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top

    - search.suggest
    - search.highlight
    - search.share

    - content.code.copy
    - content.tabs.link

plugins:
  - search

markdown_extensions:

  - admonition

  - attr_list

  - md_in_html

  - tables

  - pymdownx.details

  - pymdownx.superfences

  - pymdownx.tabbed:
      alternate_style: true

nav:

  - Início: index.md

  - Sobre: sobre.md

  - Contato: contato.md

  - Disciplinas:

      - Algoritmos e Lógica de Programação:
          - Início: disciplinas/alp/index.md

      - Aprendizagem de Máquina:
          - Início: disciplinas/am/index.md

      - Estrutura de Dados:
          - Início: disciplinas/ed/index.md

      - Matemática para Computação:
          - Início: disciplinas/mc/index.md

      - Métodos para Produção do Conhecimento:
          - Início: disciplinas/mpc/index.md

      - Processamento de Linguagem Natural:
          - Início: disciplinas/pln/index.md